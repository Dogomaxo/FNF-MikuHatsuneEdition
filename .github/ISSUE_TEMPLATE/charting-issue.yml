name: Charting Issue
description: Report an issue with the placement of notes in the game.
labels: ["type: charting issue", "status: pending triage"]
title: "Charting Issue: "
body:
  - type: markdown
    attributes:
      value: "# PLEASE READ THE [CONTRIBUTING GUIDE](https://github.com/Dogomaxo/FNF-MikuHatsuneEdition/blob/main/docs/CONTRIBUTING.md) BEFORE OPENING ISSUES!"

  - type: checkboxes
    attributes:
      label: Issue Checklist
      description: Be sure to complete these steps to increase the chances of your issue being addressed!
      options:
        - label: I have read the [Contributing Guide](https://github.com/Dogomaxo/FNF-MikuHatsuneEdition/blob/main/docs/CONTRIBUTING.md)
        - label: I have checked the Issues/Discussions pages to see if my issue has already been reported
        - label: I have properly titled my issue

  - type: dropdown
    attributes:
      label: Platform
      description: Which platform are you playing on?
      options:
        - Android
        - iOS/iPadOS
        - Windows
        - MacOS
        - Linux
    validations:
      required: true

  - type: input
    attributes:
      label: Mod version
      description: Which version are you playing on?.
      options:
        - 0.0.1-pre.alpha
        - main branch version
        - develop branch version
    validations:
      required: true

  - type: input
    attributes:
      label: Game version
      description: Which version of the game are you playing on? The game version is in the bottom left corner of the main menu.
      placeholder: ex. 0.7.4
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Describe the charting issue(s)."

  - type: markdown
    attributes:
      value: "### Please do not report issues about the content of the Funkin engine base game if it is not related to something with the mod content... These must be reported in their [respective repository.](https://github.com/FunkinCrew/Funkin/issues)"

  - type: textarea
    attributes:
      label: Location
      description: Where did you find the issue(s)? Include the name of the song, the variation, the difficulty, the time/section of the song, and any images or videos.
      placeholder: ex. Far Away on Extreme difficulty at Section 30
    validations:
      required: true

  - type: textarea
    attributes:
      label: Description
      description: Why do you believe this is an issue? Is a note at the wrong time, a hold note too short/long, or something else?
      placeholder: Describe the charting issue(s) here...
    validations:
      required: true
