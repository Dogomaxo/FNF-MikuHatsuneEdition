name: Crash Report
description: Report a crash that occurred while playing the game.
labels: ["type: major bug", "status: pending triage"]
title: "Crash Report: "
body:
  - type: markdown
    attributes:
      value: "# PLEASE READ THE [CONTRIBUTING GUIDE](https://github.com/Dogomaxo/FNF-MikuHatsuneEdition/blob/main/docs/CONTRIBUTING.md) BEFORE OPENING ISSUES!"

  - type: checkboxes
    attributes:
      label: Issue Checklist
      description: Be sure to complete these steps to increase the chances of your issue being addressed!
      options:
        - label: I have read the [Contributing Guide](https://github.com/Dogomaxo/FNF-MikuHatsuneEdition/blob/main/docs/CONTRIBUTING.md)
        - label: I have checked the Issues/Discussions pages to see if my issue has already been reported
        - label: I have properly titled my issue

  - type: dropdown
    attributes:
      label: Platform
      description: Which platform are you playing on?
      options:
        - Android
        - iOS/iPadOS
        - Windows
        - MacOS
        - Linux
    validations:
      required: true

  - type: input
    attributes:
      label: Mobile Device Model
      description: (Mobile users only) What mobile device are you playing on?
      placeholder: ex. iPhone 16, Galaxy S25, iPad 11th Gen

  - type: input
    attributes:
      label: Mobile OS Version
      description: (Mobile users only) What version is your Operating System?
      placeholder: ex. iOS 18.5, Android 15, iPadOS 18.5

  - type: dropdown
    attributes:
      label: Mod version
      description: Which version are you playing on?.
      options:
        - 0.0.1-pre.alpha
        - main branch version
        - develop branch version
    validations:
      required: true

  - type: input
    attributes:
      label: Game version
      description: Which version of the game are you playing on? The game version is in the bottom left corner of the main menu.
      placeholder: ex. 0.7.4
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Describe the crash."

  - type: markdown
    attributes:
      value: "### Please do not report issues about the content of the Funkin engine base game if it is not related to something with the mod content... These must be reported in their [respective repository.](https://github.com/FunkinCrew/Funkin/issues)"

  - type: textarea
    attributes:
      label: Description
      description: Include screenshots or videos of the crash happening. Provide as much detail as you can.
      placeholder: Describe the crash here...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: What steps can other people take to reliably trigger this crash?
      placeholder: 1. Open the game...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Crash logs
      description: These can be found in the logs folder where Funkin.exe is, or in your mobile device's file explorer.
      placeholder: Upload your logs here...
    validations:
      required: true